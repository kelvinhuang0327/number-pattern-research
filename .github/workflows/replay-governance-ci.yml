name: Replay Governance CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      db_path:
        description: "Optional absolute/relative path to replay DB fixture for dedicated lane"
        required: false
        default: ""

jobs:
  replay-default-validation:
    name: replay-default-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/replay-governance-ci.yml
            /analysis/p246k_canonical_big_lotto_nist_reaudit.py
            /index.html
            /styles.css
            /src/
            /lottery_api/database.py
            /lottery_api/routes/__init__.py
            /lottery_api/routes/replay.py
            /lottery_api/models/__init__.py
            /lottery_api/models/replay_strategy_registry.py
            /lottery_api/models/replay_strategy_state_labels.py
            /lottery_api/models/power_lotto_second_zone.py
            /lottery_api/models/biglotto_zone_split_adapter.py
            /lottery_api/models/biglotto_social_wisdom_adapter.py
            /lottery_api/models/biglotto_p0_2bet_adapter.py
            /outputs/randomness_audit/randomness_audit_results.json
            /outputs/randomness_audit/randomness_audit_summary.md
            /pytest.ini
            /scripts/randomness_audit.py
            /scripts/p238b_nist_randomness_audit_artifact_build.py
            /scripts/run_replay_ci_default_validation.py
            /scripts/build_replay_test_fixture.py
            /scripts/run_replay_ci_db_validation.py
            /tests/conftest.py
            /tests/test_randomness_audit_cadence.py
            /tests/test_strategy_replay_history_cutoff_integrity.py
            /tests/test_replay_browser_smoke.py
            /tests/test_replay_api_contract.py
            /tests/test_replay_freshness_cadence.py
            /wiki/system/randomness_final_verdict.md


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi "pydantic>=2,<3" python-multipart

      - name: Run default replay validation lane
        run: |
          python scripts/run_replay_ci_default_validation.py

  replay-browser-e2e-validation:
    name: replay-browser-e2e-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/replay-governance-ci.yml
            /analysis/p246k_canonical_big_lotto_nist_reaudit.py
            /index.html
            /styles.css
            /src/
            /lottery_api/database.py
            /lottery_api/routes/__init__.py
            /lottery_api/routes/replay.py
            /lottery_api/models/__init__.py
            /lottery_api/models/replay_strategy_registry.py
            /lottery_api/models/replay_strategy_state_labels.py
            /lottery_api/models/power_lotto_second_zone.py
            /lottery_api/models/biglotto_zone_split_adapter.py
            /lottery_api/models/biglotto_social_wisdom_adapter.py
            /lottery_api/models/biglotto_p0_2bet_adapter.py
            /outputs/randomness_audit/randomness_audit_results.json
            /outputs/randomness_audit/randomness_audit_summary.md
            /pytest.ini
            /scripts/randomness_audit.py
            /scripts/p238b_nist_randomness_audit_artifact_build.py
            /scripts/run_replay_ci_default_validation.py
            /scripts/build_replay_test_fixture.py
            /scripts/run_replay_ci_db_validation.py
            /tests/conftest.py
            /tests/test_randomness_audit_cadence.py
            /tests/test_strategy_replay_history_cutoff_integrity.py
            /tests/test_replay_browser_smoke.py
            /tests/test_replay_api_contract.py
            /tests/test_replay_freshness_cadence.py
            /wiki/system/randomness_final_verdict.md


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install browser validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi "pydantic>=2,<3" python-multipart playwright

      - name: Install Chromium browser binaries
        run: |
          python -m playwright install --with-deps chromium

      - name: Run lifecycle browser E2E validation
        run: |
          python -m pytest tests/test_replay_browser_smoke.py -q

  replay-dedicated-db-validation:
    name: replay-dedicated-db-validation
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      LOTTERY_REPLAY_DB_PATH: /tmp/lottery_replay_test_fixture.db
      LOTTERY_TEST_DB_PATH: /tmp/lottery_replay_test_fixture.db
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/replay-governance-ci.yml
            /analysis/p246k_canonical_big_lotto_nist_reaudit.py
            /index.html
            /styles.css
            /src/
            /lottery_api/database.py
            /lottery_api/routes/__init__.py
            /lottery_api/routes/replay.py
            /lottery_api/models/__init__.py
            /lottery_api/models/replay_strategy_registry.py
            /lottery_api/models/replay_strategy_state_labels.py
            /lottery_api/models/power_lotto_second_zone.py
            /lottery_api/models/biglotto_zone_split_adapter.py
            /lottery_api/models/biglotto_social_wisdom_adapter.py
            /lottery_api/models/biglotto_p0_2bet_adapter.py
            /outputs/randomness_audit/randomness_audit_results.json
            /outputs/randomness_audit/randomness_audit_summary.md
            /pytest.ini
            /scripts/randomness_audit.py
            /scripts/p238b_nist_randomness_audit_artifact_build.py
            /scripts/run_replay_ci_default_validation.py
            /scripts/build_replay_test_fixture.py
            /scripts/run_replay_ci_db_validation.py
            /tests/conftest.py
            /tests/test_randomness_audit_cadence.py
            /tests/test_strategy_replay_history_cutoff_integrity.py
            /tests/test_replay_browser_smoke.py
            /tests/test_replay_api_contract.py
            /tests/test_replay_freshness_cadence.py
            /wiki/system/randomness_final_verdict.md


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi "pydantic>=2,<3" python-multipart

      - name: Build synthetic replay DB fixture
        run: |
          FIXTURE_PATH="/tmp/lottery_replay_test_fixture.db"
          if [ -n "${{ github.event.inputs.db_path }}" ]; then
            FIXTURE_PATH="${{ github.event.inputs.db_path }}"
          fi
          python scripts/build_replay_test_fixture.py --output "${FIXTURE_PATH}"
          echo "LOTTERY_REPLAY_DB_PATH=${FIXTURE_PATH}" >> "${GITHUB_ENV}"
          echo "LOTTERY_TEST_DB_PATH=${FIXTURE_PATH}" >> "${GITHUB_ENV}"
          echo "fixture_path=${FIXTURE_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Log dedicated DB fixture path
        run: |
          if [ -z "${LOTTERY_REPLAY_DB_PATH}" ]; then
            echo "LOTTERY_REPLAY_DB_PATH is empty; dedicated lane should fail fast."
          else
            echo "LOTTERY_REPLAY_DB_PATH=${LOTTERY_REPLAY_DB_PATH}"
          fi

      - name: Run dedicated replay DB validation lane
        run: |
          python scripts/run_replay_ci_db_validation.py --validate-fixture
